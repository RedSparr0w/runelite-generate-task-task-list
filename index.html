<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Runelite Task Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Task Tier Grid</h1>
    <!-- loading overlay -->
    <div id="loading" class="d-flex justify-content-center align-items-center">
        <div class="loading-icons">
            <img src="https://oldschool.runescape.wiki/images/9/93/Clue_scroll_(beginner).png" class="loading-icon" />
            <img src="https://oldschool.runescape.wiki/images/6/67/Clue_scroll_(easy).png" class="loading-icon" />
            <img src="https://oldschool.runescape.wiki/images/4/4d/Clue_scroll_(medium).png" class="loading-icon" />
            <img src="https://oldschool.runescape.wiki/images/0/0d/Clue_scroll_(hard).png" class="loading-icon" />
        </div>
    </div>
    <div id="grid-container">
        <div id="grid"></div>
    </div>

    <!-- modal for task details -->
    <div id="task-modal" class="modal">
        <div class="modal-content card">
            <div class="card-body">
                <button type="button" class="btn-close modal-close float-end" aria-label="Close"></button>
                <h5 id="modal-title" class="card-title"></h5>
                <img id="modal-image" src="" alt="" class="img-fluid my-2" style="max-height:64px;">
                <p id="modal-tip" class="card-text"></p>
                <a id="modal-wiki" href="#" target="_blank" class="btn btn-sm btn-primary">Wiki page</a>
                <button id="modal-complete" class="btn btn-sm btn-success mt-2" style="display:none;">Mark complete</button>
            </div>
        </div>
    </div>

    <script src="grid.js" type="module"></script>
</body>
</html>
