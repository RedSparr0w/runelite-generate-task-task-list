<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Runelite Task Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="username-gate">
        <form id="username-form" class="username-card" autocomplete="off">
            <h2>Enter RuneScape Username</h2>
            <p>Used to load your collection log progress.</p>
            <input id="username-input" name="username" type="text" maxlength="12" placeholder="e.g. Zamoraky V" required>
            <button id="username-submit" type="submit">Continue</button>
            <div id="username-error" aria-live="polite"></div>
        </form>
    </div>

    <div id="unlock-hud">
        <div class="hud-title">Progress</div>
        <div class="hud-row">
            <span class="hud-label">Unlocks</span>
            <span id="hud-unlocks">0 / 0</span>
        </div>
        <div class="hud-row">
            <span class="hud-label">Next Unlock</span>
            <span id="hud-next-unlock">0 tasks</span>
        </div>
    </div>
    <button id="sync-button" type="button" title="Reload collection log progress">Sync</button>

    <!-- loading overlay -->
    <div id="loading" class="d-flex justify-content-center align-items-center">
        <div class="loading-icons">
            <img src="https://oldschool.runescape.wiki/images/9/93/Clue_scroll_(beginner).png" class="loading-icon" />
            <img src="https://oldschool.runescape.wiki/images/6/67/Clue_scroll_(easy).png" class="loading-icon" />
            <img src="https://oldschool.runescape.wiki/images/4/4d/Clue_scroll_(medium).png" class="loading-icon" />
            <img src="https://oldschool.runescape.wiki/images/0/0d/Clue_scroll_(hard).png" class="loading-icon" />
            <img src="https://oldschool.runescape.wiki/images/0/0e/Clue_scroll_(elite).png" class="loading-icon" />
            <img src="https://oldschool.runescape.wiki/images/2/2a/Clue_scroll_(master).png" class="loading-icon" />
        </div>
    </div>
    <div id="grid-container">
        <div id="grid-stage">
            <div id="grid"></div>
        </div>
    </div>

    <!-- modal for task details -->
    <div id="task-modal" class="modal">
        <div class="modal-content">
            <button type="button" class="modal-close" aria-label="Close">×</button>
            <div class="modal-header-row">
                <img id="modal-image" src="" alt="">
                <div class="modal-copy">
                    <h5 id="modal-title"></h5>
                    <p id="modal-tip"></p>
                </div>
            </div>
            <div class="modal-actions">
                <a id="modal-wiki" href="#" target="_blank" rel="noopener noreferrer">Wiki page</a>
                <button id="modal-complete" style="display:none;">Mark complete</button>
            </div>
            <div id="modal-items-required"></div>
            <div id="modal-items"></div>
        </div>
    </div>

    <!-- unlock gained notification -->
    <div id="unlock-toast" role="status" aria-live="polite">
        <span class="unlock-toast-icon">🔓</span>
        <div class="unlock-toast-body">
            <span class="unlock-toast-title">New unlock slot!</span>
            <span class="unlock-toast-sub">You can now have up to <strong id="unlock-toast-slots">1</strong> tasks active at once</span>
        </div>
        <button type="button" class="unlock-toast-close" aria-label="Dismiss">×</button>
    </div>

    <script src="grid.js" type="module"></script>
</body>
</html>
