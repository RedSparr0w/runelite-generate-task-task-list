<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Runelite Task Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Task Tier Grid</h1>
    <div id="grid-container">
        <div id="grid"></div>
    </div>

    <!-- modal for task details -->
    <div id="task-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h2 id="modal-title"></h2>
            <img id="modal-image" src="" alt="" width="64" height="64">
            <p id="modal-tip"></p>
            <a id="modal-wiki" href="#" target="_blank">View wiki page</a>
            <button id="modal-complete" style="margin-top:10px;display:none;">Mark as complete</button>
        </div>
    </div>

    <script src="grid.js" type="module"></script>
</body>
</html>
